name: Build + publish image

# Builds cfg-server-codeserver and publishes to ghcr.io.
#   - main branch push → :main + :main-<short-sha>   ⚠️ NOT :latest
#   - tagged release (v*) → :<tag> + :latest
#
# ⚠️ `:latest` MOVES ONLY ON A `v*` TAG (2026-08-06). It is what core-server's
# kind-image.ts pulls with `imagePull: always` for EVERY user container launch,
# so while it tracked `main` a promotion shipped straight to users with no
# release decision in between. Cutting a tag is that decision. `:main-<sha>`
# stays as the inspection and rollback handle.
#
# linux/amd64 only — the fleet host is amd64; code-server publishes arm64
# images too, so widen `platforms` if a local-arm use case ever appears.

on:
  push:
    branches: [main, next]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      code_server_version:
        description: 'Upstream code-server version (image tag, e.g. 4.131.0)'
        required: false
        default: '4.131.0'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cfg-server-codeserver
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ⚠️ The fallback below overrides the Dockerfile ARG on every non-dispatch
          # build — tag builds included. Keep it in sync with Dockerfile CODE_SERVER_VERSION.
          build-args: |
            CODE_SERVER_VERSION=${{ github.event.inputs.code_server_version || '4.131.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
