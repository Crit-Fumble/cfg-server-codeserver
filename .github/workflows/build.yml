name: Build + publish image

# Builds cfg-server-codeserver and publishes to ghcr.io.
#   - main branch push → :main + :main-<short-sha>   ⚠️ NOT :latest
#   - tagged release (v*) → :<tag> + :latest
#
# ⚠️ `:latest` MOVES ONLY ON A `v*` TAG (2026-08-06). It is what core-server's
# kind-image.ts pulls with `imagePull: always` for EVERY user container launch,
# so while it tracked `main` a promotion shipped straight to users with no
# release decision in between. Cutting a tag is that decision. `:main-<sha>`
# stays as the inspection and rollback handle.
#
# linux/amd64 only — the fleet host is amd64; code-server publishes arm64
# images too, so widen `platforms` if a local-arm use case ever appears.

on:
  push:
    branches: [main, next]
    tags: ['v*']
  # Without this, a PR into next reports ZERO checks and merges unbuilt —
  # the first signal that the Dockerfile broke would be a push to next.
  # PR runs build without pushing (see the login + `push:` gates below),
  # matching cfg-server-cauldronvtt.
  pull_request:
    branches: [main, next]
  workflow_dispatch:
    inputs:
      code_server_version:
        description: 'Override the Dockerfile pin for an ad-hoc build (e.g. 4.133.0). Leave EMPTY to build the pinned version.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⛔ THE DOCKERFILE ARG IS THE ONLY HOME FOR THIS VERSION. This step used to
      # be a literal `|| '4.131.0'` fallback inline in build-args, which silently
      # OVERRODE the Dockerfile on every non-dispatch build — tag builds included.
      # It drifted exactly as you would expect: the Dockerfile went to 4.133.0 via
      # the upstream-watch bump (which cannot edit workflows — the fleet App has no
      # `workflows` permission) while this file still forced 4.131.0, so `:latest`
      # shipped 4.131.0 under a LABEL claiming 4.133.0, and nothing went red.
      # Reading the pin instead of restating it makes that class impossible.
      - name: Resolve code-server version
        id: version
        run: |
          set -euo pipefail
          requested='${{ github.event.inputs.code_server_version }}'
          if [ -z "$requested" ]; then
            resolved=$(sed -nE 's/^ARG CODE_SERVER_VERSION=(.*)$/\1/p' Dockerfile | head -1)
          else
            resolved="$requested"
          fi
          # A renamed/removed ARG must fail loudly, never build an empty version.
          echo "$resolved" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::resolved code-server version '$resolved' is not a semver triple — is ARG CODE_SERVER_VERSION still in the Dockerfile?"; exit 1; }
          echo "code_server=$resolved" >> "$GITHUB_OUTPUT"
          echo "Resolved code-server version: $resolved"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cfg-server-codeserver
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CODE_SERVER_VERSION=${{ steps.version.outputs.code_server }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
